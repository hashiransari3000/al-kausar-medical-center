<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Al-Kausar Medical Center</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body.auth-page { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--soft); }
    .auth-card { max-width: 420px; width: 100%; text-align: center; padding: 2rem; }
    .auth-card img { width: 96px; margin-bottom: 1rem; }
    .auth-card .form-group { text-align: left; margin: .8rem 0; }
    .auth-card label { display: block; font-size: .85rem; font-weight: 600; margin-bottom: .35rem; }
    .auth-card input { width: 100%; padding: .7rem; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; background: var(--card-bg, #fff); color: var(--text, #111); }
    .auth-card .primary-btn { width: 100%; padding: .8rem; margin-top: .5rem; }
    .error-msg { color: #c62828; min-height: 1.2em; font-size: .9rem; margin-top: .6rem; }
    .success-msg { color: #2e7d32; min-height: 1.2em; font-size: .9rem; margin-top: .6rem; }
    .hint { margin-top: 1rem; font-size: .85rem; color: var(--muted); }
    .tabs { display: flex; gap: .5rem; justify-content: center; margin-bottom: 1rem; }
    .tabs button { flex: 1; padding: .55rem; border-radius: 8px; border: 1px solid var(--border); background: transparent; cursor: pointer; font-weight: 600; color: var(--muted); }
    .tabs button.active { background: var(--primary, #0c66a4); color: #fff; border-color: var(--primary, #0c66a4); }
    .step { display: none; }
    .step.active { display: block; }
    a.link { cursor: pointer; color: var(--primary, #0c66a4); text-decoration: underline; }
  </style>
</head>
<body class="auth-page">
  <div class="auth-card card">
    <img src="assets/logo.png" alt="Al-Kausar Logo" />
    <h1>Al-Kausar Medical Center</h1>
    <p style="margin:.2rem 0 1.2rem; color: var(--muted);">Book appointments &amp; orders securely</p>

    <div class="tabs">
      <button id="tabSignIn" class="active" type="button">Sign In</button>
      <button id="tabSignUp" type="button">Create Account</button>
    </div>

    <!-- ============ SIGN IN ============ -->
    <div id="stepSignIn" class="step active">
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="username">Email</label>
          <input id="username" type="text" required autocomplete="username" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" type="password" required autocomplete="current-password" placeholder="Your password" />
        </div>
        <button type="submit" class="primary-btn">Sign In</button>
        <div id="loginError" class="error-msg"></div>
      </form>
    </div>

    <!-- ============ CREATE ACCOUNT ============ -->
    <div id="stepSignUp" class="step">
      <form id="signupForm" novalidate>
        <div class="form-group">
          <label for="suName">Full name</label>
          <input id="suName" type="text" autocomplete="name" placeholder="e.g. Hashir Salam" />
        </div>
        <div class="form-group">
          <label for="suEmail">Email</label>
          <input id="suEmail" type="email" required autocomplete="email" placeholder="you@example.com" />
        </div>
        <div class="form-group">
          <label for="suPassword">Password</label>
          <input id="suPassword" type="password" required autocomplete="new-password" placeholder="8+ chars with letters, numbers &amp; symbols" />
        </div>
        <div class="form-group">
          <label for="suPassword2">Confirm password</label>
          <input id="suPassword2" type="password" required autocomplete="new-password" placeholder="Repeat your password" />
        </div>
        <button type="submit" class="primary-btn">Create Account</button>
        <div id="signupError" class="error-msg"></div>
      </form>
    </div>

    <!-- ============ VERIFY EMAIL ============ -->
    <div id="stepVerify" class="step">
      <p style="color: var(--muted); margin:.4rem 0 1rem;">
        We sent a 6-digit verification code to<br /><strong id="verifyEmailDest" style="color:var(--text);"></strong>
      </p>
      <form id="verifyForm" novalidate>
        <div class="form-group">
          <label for="verificationCode">Verification code</label>
          <input id="verificationCode" type="text" inputmode="numeric" autocomplete="one-time-code" required placeholder="6-digit code" maxlength="6" />
        </div>
        <button type="submit" class="primary-btn">Verify Email</button>
        <div id="verifyError" class="error-msg"></div>
        <div id="verifySuccess" class="success-msg"></div>
      </form>
      <p class="hint">Didn't get it? <a class="link" id="resendCode">Resend code</a> &nbsp;•&nbsp; <a class="link" id="backToSignup">Use another email</a></p>
    </div>

    </div>

  <script>
    // --- In-app authentication with Amazon Cognito ---
    // Sign up with email -> verification code by email -> confirm -> sign in.
    // All credential traffic goes over HTTPS straight to Cognito; the API stays
    // protected by the Cognito JWT authorizer.
    const CLIENT_ID = "m0s0e255m43a8gpf62k69rhjb";
    const ENDPOINT = "https://cognito-idp.ap-south-1.amazonaws.com/";
    const SESSION_KEYS = {
      access: "akmc_access_token",
      id: "akmc_id_token",
      refresh: "akmc_refresh_token",
      expires: "akmc_token_expires",
      user: "akmc_user"
    };

    const $ = (id) => document.getElementById(id);
    const steps = { signIn: $("stepSignIn"), signUp: $("stepSignUp"), verify: $("stepVerify") };

    let pendingEmail = null;    // email used in the current sign-up / verify session
    let pendingPassword = null; // kept in memory only, never written to storage

    function showStep(name) {
      Object.values(steps).forEach(s => s.classList.toggle("active", s.id === "step" + name[0].toUpperCase() + name.slice(1)));
      $("tabSignIn").classList.toggle("active", name === "signIn");
      $("tabSignUp").classList.toggle("active", name === "signUp");
    }

    function setError(el, msg) { el.textContent = msg || ""; }
    function decodeJwtPayload(token) {
      try {
        const b = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(atob(b));
      } catch (e) { return {}; }
    }

    async function callCognito(target, body) {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/x-amz-json-1.1",
          "X-Amz-Target": "AWSCognitoIdentityProviderService." + target,
          "X-Amz-User-Agent": "aws-amplify/0.1.x js"
        },
        body: JSON.stringify(body)
      });
      const data = await res.json();
      if (!res.ok) {
        const err = new Error(data.message || data.code || "Request failed");
        err.code = data.__type || "";
        throw err;
      }
      return data;
    }

    function friendlyMessage(err) {
      const m = err.message || "";
      if (/NotAuthorized|Incorrect username or password/i.test(m)) return "Incorrect email or password.";
      if (/UserNotFoundException/.test(m) && /signUp|Resend|confirm/i.test(err.code || "")) return "No pending sign-up found for this email.";
      if (/UserNotFoundException/i.test(m)) return "No account found for that email. Create one above.";
      if (/PasswordResetRequiredException/i.test(m)) return "A password reset is required for this account.";
      if (/UsernameExistsException/i.test(m)) return "This email is already registered. Try signing in, or check your inbox for a verification code.";
      if (/InvalidPasswordException/i.test(m)) return "Password doesn't meet the policy: 8+ characters with upper/lowercase letters, a number and a symbol.";
      if (/CodeMismatchException/i.test(m)) return "Incorrect code. Check the email and try again.";
      if (/ExpiredCodeException/i.test(m)) return "That code expired. Please resend a new one.";
      if (/LimitExceededException|TooManyFailedAttempts|TooManyRequests/i.test(m)) return "Too many attempts. Please wait a few minutes and try again.";
      if (/InvalidEmailRoleAccessPolicy/i.test(m)) return "We couldn't send the verification email right now. Please try again later.";
      if (/NetworkError|Failed to fetch/i.test(m)) return "Could not reach the authentication service. Check your connection.";
      return m;
    }

    // ---------------- Sign in ----------------
    async function signIn(username, password) {
      const data = await callCognito("InitiateAuth", {
        AuthFlow: "USER_PASSWORD_AUTH",
        ClientId: CLIENT_ID,
        AuthParameters: { USERNAME: username, PASSWORD: password }
      });
      const auth = data.AuthenticationResult;
      if (!auth || !auth.AccessToken) throw new Error("No session was returned.");

      sessionStorage.setItem(SESSION_KEYS.access, auth.AccessToken);
      if (auth.IdToken) sessionStorage.setItem(SESSION_KEYS.id, auth.IdToken);
      if (auth.RefreshToken) sessionStorage.setItem(SESSION_KEYS.refresh, auth.RefreshToken);
      sessionStorage.setItem(SESSION_KEYS.expires, String(Date.now() + auth.ExpiresIn * 1000));

      const payload = decodeJwtPayload(auth.IdToken || auth.AccessToken);
      sessionStorage.setItem(SESSION_KEYS.user, JSON.stringify({
        email: payload.email || username,
        username: payload["cognito:username"] || username,
        name: payload.name || payload.email || username,
        exp: payload.exp
      }));
      window.location.replace(window.location.origin + "/index.html");
    }

    $("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      setError($("loginError"));
      const username = $("username").value.trim();
      const password = $("password").value;
      if (!username || !password) { setError($("loginError"), "Please enter your email and password."); return; }
      const btn = $("loginForm").querySelector(".primary-btn");
      btn.disabled = true; btn.textContent = "Signing in...";
      try { await signIn(username, password); }
      catch (err) { setError($("loginError"), friendlyMessage(err)); }
      finally { btn.disabled = false; btn.textContent = "Sign In"; }
    });

    // ---------------- Sign up ----------------
    function goToVerify(email, password) {
      pendingEmail = email;
      pendingPassword = password;
      $("verifyEmailDest").textContent = email;
      setError($("verifyError"));
      setError($("verifySuccess"));
      showStep("verify");
      $("verificationCode").focus();
    }

    $("signupForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      setError($("signupError"));
      const name = $("suName").value.trim();
      const email = $("suEmail").value.trim().toLowerCase();
      const p1 = $("suPassword").value;
      const p2 = $("suPassword2").value;
      if (!email || !p1) { setError($("signupError"), "Please fill in your email and password."); return; }
      if (p1 !== p2) { setError($("signupError"), "Passwords do not match."); return; }
      const btn = $("signupForm").querySelector(".primary-btn");
      btn.disabled = true; btn.textContent = "Creating account...";
      try {
        const attrs = [{ Name: "email", Value: email }];
        if (name) attrs.push({ Name: "name", Value: name });
        await callCognito("SignUp", { ClientId: CLIENT_ID, Username: email, Password: p1, UserAttributes: attrs, ClientMetadata: {} });
        goToVerify(email, p1);
      } catch (err) {
        if (/UsernameExistsException/.test(err.code || "")) {
          // Maybe already confirmed -> try sign in, or existing unconfirmed -> go verify
          setError($("signupError"), "This email is already registered. Try signing in instead.");
        } else {
          setError($("signupError"), friendlyMessage(err));
        }
      } finally {
        btn.disabled = false; btn.textContent = "Create Account";
      }
    });

    // ---------------- Verify email ----------------
    $("verifyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      setError($("verifyError"));
      setError($("verifySuccess"));
      const code = $("verificationCode").value.trim();
      if (!code || code.length !== 6) { setError($("verifyError"), "Enter the 6-digit code from your email."); return; }
      const btn = $("verifyForm").querySelector(".primary-btn");
      btn.disabled = true; btn.textContent = "Verifying...";
      try {
        await callCognito("ConfirmSignUp", { ClientId: CLIENT_ID, Username: pendingEmail, ConfirmationCode: code });
        setError($("verifyError"));
        setError($("verifySuccess"), "Email verified! Signing you in...");
        if (pendingEmail && pendingPassword) {
          window.setTimeout(() => signIn(pendingEmail, pendingPassword).catch(err => {
            showStep("signIn");
            $("username").value = pendingEmail;
            setError($("loginError"), friendlyMessage(err) + " Try signing in now.");
          }), 600);
        } else {
          showStep("signIn");
          $("username").value = pendingEmail;
        }
      } catch (err) {
        setError($("verifyError"), friendlyMessage(err));
      } finally {
        btn.disabled = false; btn.textContent = "Verify Email";
      }
    });

    $("resendCode").addEventListener("click", async () => {
      setError($("verifyError")); setError($("verifySuccess"));
      const link = $("resendCode");
      link.textContent = "Sending...";
      try {
        await callCognito("ResendConfirmationCode", { ClientId: CLIENT_ID, Username: pendingEmail });
        setError($("verifySuccess"), "A new code was sent to " + pendingEmail + ".");
      } catch (err) {
        setError($("verifyError"), friendlyMessage(err));
      } finally {
        link.textContent = "Resend code";
      }
    });

    $("backToSignup").addEventListener("click", () => { showStep("signUp"); });

    // ---------------- Tabs ----------------
    $("tabSignIn").addEventListener("click", () => { showStep("signIn"); setError($("loginError")); });
    $("tabSignUp").addEventListener("click", () => { showStep("signUp"); setError($("signupError")); });

    $("username").focus();
  </script>
</body>
</html>
